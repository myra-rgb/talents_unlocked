<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password · Talents Unlocked</title>
    <link rel="stylesheet" href="/style.css?v=3">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">Talents Unlocked<span class="brand-dot">.</span></a>
    </header>
    <main class="layout">
        <section class="form-panel">
            <div class="form-content">
                <p class="eyebrow">LET'S FIND YOUR ACCOUNT</p>
                <h2>Forgot your password?</h2>
                <p class="subtitle">Enter the email you used to sign up.</p>
                <div id="notice-box"></div>
                <form id="forgot-form">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                    <p class="field-help">Demo mode: reset emails are not sent.</p>
                    <button type="submit">Send Reset Link</button>
                </form>
                <p class="switch-page"><a href="/login.html">← Back to Login</a></p>
            </div>
        </section>
    </main>
    <footer>Talents Unlocked</footer>
    <script src="/app.js"></script>
</body>
</html>
