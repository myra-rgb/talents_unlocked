<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · Talents Unlocked</title>
    <link rel="stylesheet" href="/style.css?v=3">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">Talents Unlocked<span class="brand-dot">.</span></a>
    </header>
    <main class="layout">
        <section class="form-panel">
            <div class="form-content">
                <p class="eyebrow">YOUR DASHBOARD</p>
                <h2>Welcome back!</h2>
                <p class="subtitle">What would you like to do today?</p>
                <div class="account-card">
                    <span class="avatar" id="user-avatar" aria-hidden="true">U</span>
                    <div>
                        <strong id="user-name">User</strong>
                        <p id="user-email">user@example.com</p>
                    </div>
                </div>
                <p class="dashboard-copy">You're all signed in. This is your starting space on Talents Unlocked.</p>
                <form id="logout-form">
                    <button class="secondary" type="submit">Log Out</button>
                </form>
            </div>
        </section>
    </main>
    <footer>Talents Unlocked</footer>
    <script src="/app.js"></script>
</body>
</html>
